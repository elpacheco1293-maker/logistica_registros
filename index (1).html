<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Registro de devolución · NEXOCORP</title>
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Sora:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f4fb;--card:#fff;--tx:#14143a;--mut:#62628a;--bd:#e0e1f3;--ac:#5454ea;--acd:#3d3dd1;--acx:#fff;--tint:#eef0ff;--ok:#e1f6ec;--okx:#0f6b43;--wn:#fff2d6;--wnx:#7a5200;--er:#fde7e7;--erx:#a11d1d;--sh:0 10px 30px rgba(40,40,140,.12);color-scheme:light;box-sizing:border-box;padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d0d24;--card:#171738;--tx:#ececff;--mut:#a5a4cc;--bd:#2f2f5e;--ac:#7d7dff;--acd:#9a9aff;--acx:#0d0d24;--tint:#202049;--ok:#10362a;--okx:#7be0b4;--wn:#3a2f12;--wnx:#f1cf80;--er:#3b1b1b;--erx:#ff9c9c;--sh:0 10px 30px rgba(0,0,0,.4);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d0d24;--card:#171738;--tx:#ececff;--mut:#a5a4cc;--bd:#2f2f5e;--ac:#7d7dff;--acd:#9a9aff;--acx:#0d0d24;--tint:#202049;--ok:#10362a;--okx:#7be0b4;--wn:#3a2f12;--wnx:#f1cf80;--er:#3b1b1b;--erx:#ff9c9c;--sh:0 10px 30px rgba(0,0,0,.4);color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.45 Manrope,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
h1,h2,.brand,.btn,.stp{font-family:Sora,Manrope,system-ui,sans-serif}
.hero{position:relative;overflow:hidden;background:linear-gradient(135deg,#23237f 0%,#4343d8 55%,#6f62ff 100%);color:#fff;padding:calc(env(safe-area-inset-top,0px) + 20px) 18px 64px}
.hero svg{position:absolute;right:-50px;bottom:-34px;width:320px;opacity:.2;pointer-events:none}
.hero .in{position:relative;max-width:1000px;margin:0 auto}
.brand{display:flex;align-items:center;gap:12px;font-weight:700;font-size:17px;letter-spacing:.2px}
.brand img{width:46px;height:46px;border-radius:13px;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.brand small{display:block;font-family:Manrope,sans-serif;font-weight:500;font-size:12.5px;opacity:.8;letter-spacing:0}
h1{font-size:clamp(26px,6vw,36px);line-height:1.12;margin:26px 0 6px;font-weight:700;max-width:520px}
.lead{margin:0;opacity:.85;font-size:15px;max-width:460px}
.w{max-width:1000px;margin:-40px auto 0;padding:0 14px 28px;position:relative}
.tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.tabs button{border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:9px 16px;border-radius:999px;cursor:pointer;font:600 14px Manrope,sans-serif;box-shadow:var(--sh)}
.tabs button.on{background:var(--ac);color:var(--acx);border-color:var(--ac)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:22px 20px;margin-bottom:14px;max-width:640px;box-shadow:var(--sh)}
.card.wide{max-width:none}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}
.full{grid-column:1/-1}
label{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:600;color:var(--tx);margin-bottom:6px}label i{color:#e0404a;font-style:normal}
.n{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--ac);color:var(--acx);font:600 12px Sora,sans-serif}
.stp{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px;margin:20px 0 12px;padding-top:18px;border-top:1px dashed var(--bd)}
input,select,textarea{width:100%;min-height:48px;padding:11px 14px;border:1.5px solid var(--bd);border-radius:12px;background:var(--card);color:var(--tx);font:500 16px Manrope,sans-serif;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--ac);box-shadow:0 0 0 4px color-mix(in srgb,var(--ac) 22%,transparent)}
input[readonly]{background:var(--tint);border-color:transparent;font-weight:600}input:disabled{opacity:.5;background:var(--tint)}
.btn{width:100%;background:linear-gradient(135deg,var(--ac),var(--acd));color:var(--acx);border:0;padding:0 20px;min-height:52px;border-radius:14px;font-weight:600;font-size:16px;cursor:pointer;box-shadow:0 8px 20px color-mix(in srgb,var(--ac) 40%,transparent)}
.btn:disabled{opacity:.55}.btn:active{transform:translateY(1px)}
.msg{padding:11px 14px;border-radius:12px;margin:14px 0;font-size:14px;font-weight:500;border-left:4px solid}
.ok{background:var(--ok);color:var(--okx);border-color:var(--okx)}.wn{background:var(--wn);color:var(--wnx);border-color:var(--wnx)}.er{background:var(--er);color:var(--erx);border-color:var(--erx)}
.done{text-align:center;padding:30px 20px}
.done h2{margin:14px 0 4px;font-size:24px}.done .sb{color:var(--mut);margin:0 0 18px}
.ck{width:84px;height:84px}.ck circle{fill:var(--ok);stroke:none}.ck path{fill:none;stroke:var(--okx);stroke-width:6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:60;stroke-dashoffset:60;animation:dr .6s .15s ease-out forwards}
@keyframes dr{to{stroke-dashoffset:0}}@media(prefers-reduced-motion:reduce){.ck path{animation:none;stroke-dashoffset:0}}
.rc{text-align:left;background:var(--tint);border-radius:14px;padding:6px 16px;margin:0 0 20px}
.rc div{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px dashed var(--bd);font-size:14px}.rc div:last-child{border:0}.rc span{color:var(--mut)}.rc b{text-align:right}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:9px 10px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap}th{color:var(--mut);font-weight:600}td.n{display:table-cell;width:auto;height:auto;background:none;color:inherit;border-radius:0;text-align:right;font:inherit}
td input{min-height:36px;padding:6px 9px;min-width:160px;font-size:13px}
.kp{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}.kp div{flex:1;min-width:130px;background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:12px 14px;box-shadow:var(--sh)}
.kp b{display:block;font:700 26px Sora,sans-serif}.kp span{font-size:12.5px;color:var(--mut)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin-bottom:12px}.row>*{flex:1;min-width:150px}.row .btn{flex:0 0 auto;width:auto}
.x{background:none;border:0;color:var(--mut);cursor:pointer;font-size:16px}
.sub{color:var(--mut);font-size:13px}
[hidden]{display:none!important}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
</head>
<body>
<header class="hero">
<svg viewBox="0 0 200 120" fill="none" stroke="#fff" stroke-width="14" stroke-linecap="round" aria-hidden="true"><path d="M12 60C12 18 62 18 100 60C138 102 188 102 188 60C188 18 138 18 100 60C62 102 12 102 12 60Z"/></svg>
<div class="in">
<div class="brand"><img src="logo.png" alt="NEXOCORP"><div>NEXOCORP<small>Logística inversa</small></div></div>
<h1>Registro de devolución</h1>
<p class="lead">Productos psicotrópicos controlados. Registra tu bodega y el producto en menos de un minuto.</p>
</div>
</header>
<div class="w">
<div id="st" class="msg er" hidden></div>
<section id="reg">
<div class="card" id="fc">
<div class="g">
<div class="full"><label for="bod"><span class="n">1</span>Bodega <i>*</i></label><input id="bod" placeholder="Ej: B329" autocapitalize="characters" autocomplete="off"></div>
<div class="full"><label for="cod"><span class="n">2</span>Código del producto <i>*</i></label><input id="cod" placeholder="Primero indica tu bodega" inputmode="numeric" autocomplete="off" disabled></div>
</div>
<div id="fm" class="msg" hidden></div>
<div id="det" hidden>
<div class="stp"><span class="n">3</span>Datos del producto</div>
<div class="g">
<div class="full"><label>Descripción</label><input id="des" readonly></div>
<div><label>Proveedor</label><input id="pro" readonly></div>
<div><label>Unidad de medida</label><input id="uni" readonly></div>
<div><label>Lote <i>*</i></label><input id="lot" autocomplete="off"></div>
<div><label>Fecha de caducidad <i>*</i></label><input id="cad" type="month"></div>
<div><label>Cantidad <i>*</i></label><input id="can" type="number" min="1" inputmode="numeric"></div>
<div><label>Factura <i>*</i></label><input id="fac" autocomplete="off"></div>
</div>
<div style="margin-top:18px"><button class="btn" id="sv">Enviar registro</button></div>
</div>
</div>
<div class="card done" id="dn" hidden>
<svg class="ck" viewBox="0 0 84 84"><circle cx="42" cy="42" r="42"/><path d="M25 43l12 12 23-25"/></svg><h2>Registro exitoso</h2>
<p class="sb">Tu registro quedó guardado correctamente.</p><div class="rc" id="dnt"></div>
<div><button class="btn" id="otro">Registrar otro código</button></div>
</div>
</section>
</div>
<script>
const SUPABASE_URL="PEGA_AQUI_TU_URL",SUPABASE_KEY="PEGA_AQUI_TU_ANON_KEY";
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const norm=s=>String(s).trim().toUpperCase().replace(/\s+/g,"");
const fm=(t,c)=>{const e=$("fm");e.hidden=!t;e.className="msg "+(c||"");e.textContent=t};
const sb=SUPABASE_URL.startsWith("PEGA")?null:supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
if(!sb){$("st").hidden=false;$("st").textContent="Falta configurar SUPABASE_URL y SUPABASE_KEY en este archivo."}
let t,seq=0,prod=null,busy=false;
function resetDetail(){prod=null;$("det").hidden=true;["des","pro","uni","lot","cad","can","fac"].forEach(i=>$(i).value="")}
$("bod").addEventListener("input",()=>{const ok=norm($("bod").value).length>=2;$("cod").disabled=!ok;$("cod").placeholder=ok?"Escanea o escribe el código":"Primero indica tu bodega";if(!ok){$("cod").value="";resetDetail();fm("")}else lookup()});
$("cod").addEventListener("input",lookup);
$("cod").addEventListener("keydown",e=>{if(e.key==="Enter")e.target.blur()});
function lookup(){
  clearTimeout(t);resetDetail();fm("");
  const code=$("cod").value.trim(),bod=norm($("bod").value);
  if(!code||!bod||!sb)return;
  t=setTimeout(async()=>{
    const n=++seq,r=await sb.rpc("buscar_producto",{p_bodega:bod,p_codigo:code});
    if(n!==seq)return;
    if(r.error){fm("No se pudo consultar. Revisa tu conexión e inténtalo otra vez.","er");return}
    const d=r.data;
    if(!d.encontrado){fm("Código no encontrado. Verifica que esté bien escrito.","wn");return}
    if(d.ya_registrado){fm("La bodega "+bod+" ya realizó su registro para este código. No se puede registrar de nuevo.","er");return}
    prod=d;$("des").value=d.descripcion||"";$("pro").value=d.proveedor||"";$("uni").value=d.unidad||"";$("det").hidden=false;
  },350);
}
$("sv").onclick=async()=>{
  if(busy||!prod)return;
  const bod=norm($("bod").value),code=$("cod").value.trim(),lote=$("lot").value.trim(),cad=$("cad").value,can=parseInt($("can").value,10),fac=$("fac").value.trim();
  if(!bod||!lote||!cad||!(can>0)||!fac){fm("Todos los campos son obligatorios: lote, fecha de caducidad, cantidad y factura.","er");return}
  busy=true;$("sv").disabled=true;
  const r=await sb.rpc("registrar",{p_bodega:bod,p_codigo:code,p_lote:lote,p_caducidad:cad,p_cantidad:can,p_factura:fac});
  busy=false;$("sv").disabled=false;
  if(r.error||!r.data){fm("No se pudo guardar. Inténtalo otra vez.","er");return}
  if(!r.data.ok){fm(r.data.error==="duplicado"?"La bodega "+bod+" ya realizó su registro para este código.":"No se pudo guardar: revisa los datos.","er");return}
  $("dnt").innerHTML=[["Bodega",bod],["Producto",prod.descripcion],["Cantidad",can+" "+(prod.unidad||"")],["Lote",lote],["Caducidad",cad],["Factura",fac]].map(a=>"<div><span>"+a[0]+"</span><b>"+esc(a[1])+"</b></div>").join("");
  $("fc").hidden=true;$("dn").hidden=false;
};
$("otro").onclick=()=>{$("cod").value="";resetDetail();fm("");$("dn").hidden=true;$("fc").hidden=false;$("cod").focus()};
</script>
</body>
</html>
