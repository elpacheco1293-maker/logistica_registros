<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#080b22">
<title>Registro de devolución · NEXOCORP</title>
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Sora:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{--bg:#080b22;--card:rgba(22,26,64,.78);--bd:rgba(132,142,255,.24);--ac:#6b6bff;--ac2:#9b7bff;--tx:#eef0ff;--mut:#9aa1d8;--ok:#34d399;--wn:#fbbf24;--er:#fb7185;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0}
body{min-height:100vh;background:radial-gradient(1100px 560px at 15% -10%,#1d2270 0%,transparent 60%),var(--bg);color:var(--tx);font:16px/1.45 Manrope,system-ui,-apple-system,sans-serif;overflow-x:hidden;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.orb{position:fixed;border-radius:50%;filter:blur(70px);opacity:.38;pointer-events:none;z-index:0;animation:fl 18s ease-in-out infinite alternate}
.o1{width:380px;height:380px;background:#5b5bff;right:-130px;top:22%}.o2{width:320px;height:320px;background:#9b5bff;left:-150px;bottom:-70px;animation-delay:-8s}
@keyframes fl{to{transform:translate(-60px,-80px) scale(1.15)}}
.app{position:relative;z-index:1;max-width:520px;margin:0 auto;padding:14px 16px 40px}
.top{display:flex;align-items:center;gap:12px;padding:6px 2px 16px}.top img{width:42px;height:42px;border-radius:12px}
.top b{font:700 15px Sora,sans-serif;letter-spacing:.22em}.top small{display:block;color:var(--mut);font-size:11.5px;letter-spacing:.12em;text-transform:uppercase}
.hero{position:relative;overflow:hidden;border-radius:24px;padding:20px;background:linear-gradient(135deg,#5a63f0,#3b3fcf 70%);border:1px solid var(--bd);box-shadow:0 20px 60px rgba(60,60,255,.35);margin-bottom:14px}
.loop{position:absolute;right:-14px;top:10px;width:176px}
.loop path{fill:none;stroke-linecap:round;stroke-width:9}.loop .bg{stroke:rgba(255,255,255,.16)}
.loop .fg{stroke:#fff;stroke-dasharray:100;stroke-dashoffset:92;transition:stroke-dashoffset .9s cubic-bezier(.2,.8,.2,1);filter:drop-shadow(0 0 8px rgba(255,255,255,.65))}
.hero .tx{position:relative}
.eyebrow{font:600 11px Sora,sans-serif;letter-spacing:.16em;text-transform:uppercase;opacity:.85}
h1{font:700 26px/1.15 Sora,sans-serif;margin:10px 0 6px;max-width:62%}
.hs{opacity:.88;font-size:14px;max-width:62%;min-height:42px;margin:0}
.chips{display:flex;gap:8px;margin-top:14px;position:relative}
.chips span{flex:1;text-align:center;padding:9px 6px;border-radius:12px;background:rgba(255,255,255,.14);font:600 12px Sora,sans-serif;opacity:.75;transition:all .4s}
.chips span.on{background:#fff;color:#2c2fb8;opacity:1;transform:translateY(-2px)}
.card{border-radius:24px;border:1px solid var(--bd);background:var(--card);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);padding:4px 18px 20px;box-shadow:0 14px 40px rgba(0,0,0,.35)}
.st{padding:16px 0;border-bottom:1px dashed rgba(132,142,255,.18);transition:opacity .4s}.st.lock{opacity:.4}
.lb{display:flex;align-items:center;gap:9px;font:600 12px Sora,sans-serif;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);margin-bottom:9px}
.n{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:rgba(107,107,255,.35);color:#fff;font:700 11px Sora,sans-serif;transition:all .4s}.n.ok{background:var(--ok);color:#04261a}
input{width:100%;min-height:52px;padding:12px 14px;border-radius:14px;border:1.5px solid var(--bd);background:rgba(10,13,44,.7);color:var(--tx);font:500 17px Manrope,sans-serif;transition:border-color .2s,box-shadow .2s}
input:focus{outline:0;border-color:var(--ac);box-shadow:0 0 0 4px rgba(107,107,255,.25)}
input:disabled{opacity:.5}input::placeholder{color:#6f76b5}
.sw{position:relative}
.sw.scan::after{content:"";position:absolute;left:10px;right:10px;bottom:0;height:3px;border-radius:3px;background:linear-gradient(90deg,transparent,#b7aaff,transparent) no-repeat;background-size:45% 100%;animation:sc .9s linear infinite}
@keyframes sc{from{background-position:-60% 0}to{background-position:170% 0}}
.msg{margin-top:12px;padding:11px 14px;border-radius:14px;font-size:14px;font-weight:600;border:1px solid;animation:pop .4s cubic-bezier(.2,1.2,.3,1)}
.msg.wn{background:rgba(251,191,36,.12);color:var(--wn);border-color:rgba(251,191,36,.35)}.msg.er{background:rgba(251,113,133,.12);color:var(--er);border-color:rgba(251,113,133,.35)}
.pc{margin-top:12px;padding:14px;border-radius:16px;background:linear-gradient(135deg,rgba(107,107,255,.26),rgba(155,123,255,.12));border:1px solid var(--bd)}
.pc b{display:block;font:600 15px/1.3 Sora,sans-serif;margin-bottom:8px}.pc span{display:inline-block;margin:0 6px 4px 0;padding:4px 10px;border-radius:999px;background:rgba(255,255,255,.1);font-size:12.5px;color:#d6d9ff}
.in{animation:pop .5s cubic-bezier(.2,1.2,.3,1)}
@keyframes pop{from{opacity:0;transform:translateY(12px) scale(.96)}to{opacity:1;transform:none}}
.g{display:grid;grid-template-columns:1fr 1fr;gap:12px}.g .full{grid-column:1/-1}
.g label{display:block;font:600 11.5px Sora,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin-bottom:6px}
.q{display:flex;gap:6px}.q input{text-align:center;font:700 18px Sora,sans-serif;padding:0 4px}
.q button{flex:0 0 46px;border:1.5px solid var(--bd);border-radius:14px;background:rgba(107,107,255,.18);color:#fff;font:600 22px Sora,sans-serif;cursor:pointer;transition:transform .1s}.q button:active{transform:scale(.92)}
.act{padding-top:18px}
.btn{width:100%;min-height:56px;border:0;border-radius:16px;background:linear-gradient(135deg,#6b6bff,#9b7bff);color:#fff;font:700 16px Sora,sans-serif;cursor:pointer;box-shadow:0 10px 30px rgba(107,107,255,.45);transition:all .3s}
.btn:disabled{background:rgba(107,107,255,.22);color:rgba(255,255,255,.45);box-shadow:none;cursor:not-allowed}
.btn.rdy{animation:pl 1.8s ease-in-out infinite}@keyframes pl{50%{box-shadow:0 10px 44px rgba(155,123,255,.8);transform:translateY(-1px)}}
.hint{text-align:center;color:var(--mut);font-size:13px;margin:12px 0 0;min-height:20px}
.dn{text-align:center;padding:28px 0 10px}
.ck{width:88px;height:88px}.ck circle{fill:rgba(52,211,153,.16);stroke:var(--ok);stroke-width:3}.ck path{fill:none;stroke:var(--ok);stroke-width:6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:60;stroke-dashoffset:60;animation:dr .6s .25s ease-out forwards}
@keyframes dr{to{stroke-dashoffset:0}}
.dn h2{font:700 24px Sora,sans-serif;margin:12px 0 4px}.dn .sb{color:var(--mut);margin:0 0 18px}
.rc{text-align:left;background:rgba(107,107,255,.12);border:1px solid var(--bd);border-radius:16px;padding:4px 16px;margin-bottom:18px}
.rc div{display:flex;justify-content:space-between;gap:14px;padding:10px 0;border-bottom:1px dashed var(--bd);font-size:14px}.rc div:last-child{border:0}.rc span{color:var(--mut)}.rc b{text-align:right}
.bs{position:relative;height:0}.bs i{position:absolute;left:50%;top:70px;width:8px;height:12px;border-radius:2px;opacity:0;animation:bu 1.1s ease-out forwards}
@keyframes bu{from{opacity:1;transform:translate(0,0)}to{opacity:0;transform:translate(var(--dx),var(--dy)) rotate(var(--r))}}
[hidden]{display:none!important}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.ck path{stroke-dashoffset:0}}
</style>
</head>
<body>
<div class="orb o1"></div><div class="orb o2"></div>
<div class="app">
<div class="top"><img src="logo.png" alt="NEXOCORP"><div><b>NEXOCORP</b><small>Logística inversa</small></div></div>
<section class="hero">
<svg class="loop" viewBox="0 0 220 120" aria-hidden="true"><path class="bg" d="M20 60C20 14 82 14 110 60C138 106 200 106 200 60C200 14 138 14 110 60C82 106 20 106 20 60Z"/><path class="fg" id="lp" pathLength="100" d="M20 60C20 14 82 14 110 60C138 106 200 106 200 60C200 14 138 14 110 60C82 106 20 106 20 60Z"/></svg>
<div class="tx"><div class="eyebrow">Registro de devolución</div><h1 id="ht"></h1><p class="hs" id="hs"></p></div>
<div class="chips"><span id="c1">Bodega</span><span id="c2">Producto</span><span id="c3">Datos</span></div>
</section>
<div id="st" class="msg er" hidden></div>

<main class="card" id="fc">
<div class="st" id="s1"><div class="lb"><span class="n" id="n1">1</span>Tu bodega</div><input id="bod" placeholder="Ej: B329" autocapitalize="characters" autocomplete="off"></div>
<div class="st lock" id="s2"><div class="lb"><span class="n" id="n2">2</span>Código del producto</div>
<div class="sw" id="sw"><input id="cod" placeholder="Primero indica tu bodega" inputmode="numeric" autocomplete="off" disabled></div>
<div id="fm" class="msg" hidden></div>
<div class="pc" id="pc" hidden><b id="pd"></b><span id="pp"></span><span id="pu"></span></div></div>
<div class="st lock" id="s3"><div class="lb"><span class="n" id="n3">3</span>Datos del producto</div>
<div id="det" hidden><div class="g">
<div><label for="lot">Lote</label><input id="lot" autocomplete="off"></div>
<div><label for="cad">Caducidad</label><input id="cad" type="month"></div>
<div><label for="can">Cantidad</label><div class="q"><button type="button" id="mn" aria-label="Menos">−</button><input id="can" type="number" min="1" inputmode="numeric"><button type="button" id="mp" aria-label="Más">+</button></div></div>
<div><label for="fac">Factura</label><input id="fac" autocomplete="off"></div>
</div></div></div>
<div class="act"><button class="btn" id="sv" disabled>Enviar registro</button><p class="hint" id="hint"></p></div>
</main>

<div class="card dn" id="dn" hidden>
<div class="bs" id="bs"></div>
<svg class="ck" viewBox="0 0 88 88"><circle cx="44" cy="44" r="42"/><path d="M26 45l13 13 24-27"/></svg>
<h2>Registro exitoso</h2><p class="sb">Tu devolución quedó registrada correctamente.</p>
<div class="rc" id="dnt"></div>
<button class="btn" id="otro">Registrar otro código</button>
</div>
</div>

<script>
const SUPABASE_URL="PEGA_AQUI_TU_URL",SUPABASE_KEY="PEGA_AQUI_TU_ANON_KEY";
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const norm=s=>String(s).trim().toUpperCase().replace(/\s+/g,"");
const sb=SUPABASE_URL.startsWith("PEGA")?null:supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
if(!sb){$("st").hidden=false;$("st").textContent="Falta configurar SUPABASE_URL y SUPABASE_KEY en este archivo."}
let t,seq=0,prod=null,busy=false,dup=false,fin=false;
const T=[["Empecemos por tu bodega","Escribe el código de tu bodega para comenzar."],["¿Qué producto devuelves?","Escanea o escribe el código del producto."],["Producto encontrado","Completa los datos del lote."],["Todo listo para enviar","Revisa los datos y envía tu registro."]];
const F={lot:"lote",cad:"caducidad",can:"cantidad",fac:"factura"};
function fm(t,c){const e=$("fm");e.hidden=!t;e.className="msg "+(c||"");e.textContent=t}
function state(){
  if(fin)return;
  const b=norm($("bod").value).length>=2,miss=[];
  for(const k in F){const v=$(k).value;if(!v||(k==="can"&&!(parseInt(v,10)>0)))miss.push(F[k])}
  let s=0,p=8;
  if(b){s=1;p=30}
  if(b&&prod){s=2;p=55+(4-miss.length)*8;if(!miss.length){s=3;p=92}}
  const c=dup?["Este registro ya existe","Tu bodega ya registró este código."]:T[s];
  $("ht").textContent=c[0];$("hs").textContent=c[1];$("lp").style.strokeDashoffset=100-p;
  $("c1").classList.toggle("on",b);$("c2").classList.toggle("on",!!prod);$("c3").classList.toggle("on",s===3);
  $("n1").classList.toggle("ok",b);$("n2").classList.toggle("ok",!!prod);$("n3").classList.toggle("ok",s===3);
  $("s2").classList.toggle("lock",!b);$("s3").classList.toggle("lock",!prod);
  $("sv").disabled=s!==3;$("sv").classList.toggle("rdy",s===3);
  $("hint").textContent=s===3?"Todo listo. Revisa y envía.":prod?"Falta: "+miss.join(", ")+".":"Completa los pasos 1 y 2 para continuar.";
}
function resetDetail(){prod=null;dup=false;$("det").hidden=true;$("pc").hidden=true;["lot","cad","can","fac"].forEach(i=>$(i).value="")}
$("bod").addEventListener("input",()=>{const ok=norm($("bod").value).length>=2;$("cod").disabled=!ok;$("cod").placeholder=ok?"Escanea o escribe el código":"Primero indica tu bodega";if(!ok){$("cod").value="";resetDetail();fm("")}else lookup();state()});
$("cod").addEventListener("input",lookup);
$("cod").addEventListener("keydown",e=>{if(e.key==="Enter")e.target.blur()});
["lot","cad","can","fac"].forEach(i=>$(i).addEventListener("input",state));
$("mn").onclick=()=>{const v=Math.max(0,(parseInt($("can").value,10)||0)-1);$("can").value=v||"";state()};
$("mp").onclick=()=>{$("can").value=(parseInt($("can").value,10)||0)+1;state()};
function lookup(){
  clearTimeout(t);resetDetail();fm("");$("sw").classList.remove("scan");state();
  const code=$("cod").value.trim(),bod=norm($("bod").value);
  if(!code||!bod||!sb)return;
  $("sw").classList.add("scan");
  t=setTimeout(async()=>{
    const n=++seq,r=await sb.rpc("buscar_producto",{p_bodega:bod,p_codigo:code});
    if(n!==seq)return;
    $("sw").classList.remove("scan");
    if(r.error){fm("No se pudo consultar. Revisa tu conexión e inténtalo otra vez.","er");return}
    const d=r.data;
    if(!d.encontrado){fm("No encontramos ese código. Verifica que esté bien escrito.","wn");return}
    if(d.ya_registrado){dup=true;fm("La bodega "+bod+" ya registró este código. No se puede registrar de nuevo.","er");state();return}
    prod=d;$("pd").textContent=d.descripcion||"";$("pp").textContent=d.proveedor||"";$("pu").textContent=d.unidad||"";
    ["pc","det"].forEach(i=>{const e=$(i);e.hidden=false;e.classList.remove("in");void e.offsetWidth;e.classList.add("in")});
    state();
  },400);
}
function burst(){const b=$("bs"),cs=["#6b6bff","#9b7bff","#34d399","#fbbf24","#ffffff"];b.innerHTML="";
  for(let i=0;i<30;i++){const s=document.createElement("i"),a=Math.random()*6.283,d=70+Math.random()*100;
  s.style.cssText="--dx:"+Math.cos(a)*d+"px;--dy:"+(Math.sin(a)*d-30)+"px;--r:"+Math.random()*720+"deg;background:"+cs[i%5]+";animation-delay:"+Math.random()*.2+"s";b.appendChild(s)}}
$("sv").onclick=async()=>{
  if(busy||!prod||!sb)return;
  const bod=norm($("bod").value),code=$("cod").value.trim(),lote=$("lot").value.trim(),cad=$("cad").value,can=parseInt($("can").value,10),fac=$("fac").value.trim();
  if(!bod||!lote||!cad||!(can>0)||!fac){fm("Todos los campos son obligatorios.","er");return}
  busy=true;$("sv").disabled=true;$("sv").textContent="Enviando…";
  const r=await sb.rpc("registrar",{p_bodega:bod,p_codigo:code,p_lote:lote,p_caducidad:cad,p_cantidad:can,p_factura:fac});
  busy=false;$("sv").textContent="Enviar registro";state();
  if(r.error||!r.data){fm("No se pudo guardar. Inténtalo otra vez.","er");return}
  if(!r.data.ok){fm(r.data.error==="duplicado"?"La bodega "+bod+" ya registró este código.":"No se pudo guardar: revisa los datos.","er");return}
  fin=true;
  $("dnt").innerHTML=[["Bodega",bod],["Producto",prod.descripcion],["Cantidad",can+" "+(prod.unidad||"")],["Lote",lote],["Caducidad",cad],["Factura",fac]].map(a=>"<div><span>"+a[0]+"</span><b>"+esc(a[1])+"</b></div>").join("");
  $("ht").textContent="¡Registro completado!";$("hs").textContent="Gracias. Tu devolución quedó registrada.";$("lp").style.strokeDashoffset=0;["c1","c2","c3"].forEach(i=>$(i).classList.add("on"));
  $("fc").hidden=true;$("dn").hidden=false;burst();
};
$("otro").onclick=()=>{fin=false;$("cod").value="";resetDetail();fm("");$("dn").hidden=true;$("fc").hidden=false;state();$("cod").focus()};
state();
</script>
</body>
</html>
